<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15ba81"/>
      <stop offset="1" stop-color="#007e57"/>
    </linearGradient>
    <path id="bolt" d="M41.5 6 18 37.5H30.5L24 58 47.5 26.5H35Z" stroke-linejoin="round"/>
    <!-- A cut around the bolt where it crosses the book, so the two stay apart -->
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#bolt" fill="#000" stroke="#000" stroke-width="6.5"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- An open book: two pages meeting at the spine -->
  <g fill="#fff" mask="url(#cut)">
    <path d="M30.5 19C25 15.5 17.5 15 10.5 17V48C17.5 46 25 46.5 30.5 50Z"/>
    <path d="M33.5 19C39 15.5 46.5 15 53.5 17V48C46.5 46 39 46.5 33.5 50Z"/>
  </g>
  <use href="#bolt" fill="#fff" stroke="#fff" stroke-width="1.5"/>
</svg>
