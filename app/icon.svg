<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15ba81"/>
      <stop offset="1" stop-color="#007e57"/>
    </linearGradient>
    <!-- The bolt cut out of the book: where it crosses the pages, the green shows through -->
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39.5 9 19.5 37H31L25.5 55.5 45.5 27H34Z" fill="#000" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- An open book: two pages meeting at the spine -->
  <g fill="#fff" mask="url(#cut)">
    <path d="M30.5 17C25 13.5 17.5 13 10.5 15V49C17.5 47 25 47.5 30.5 51Z"/>
    <path d="M33.5 17C39 13.5 46.5 13 53.5 15V49C46.5 47 39 47.5 33.5 51Z"/>
